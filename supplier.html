<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Supplier</title><link rel="stylesheet" href="css.css"></head>
<body><header><div class="top"><div class="logo"></div><h1>SKY <span>SHOPPING</span></h1></div><nav><a href="index.html">Home</a><a href="supplier.html" class="active">Supplier</a><a href="admin.html">Admin</a><a href="account.html">My Account</a></nav></header>
<div class="form-box"><h2>👟 Supplier Panel - Apna Product Add Karo</h2><p style="font-size:13px">Shoe / Kapre wale yahan se product add karenge. Admin approve karega to live hoga. Har sale par Sky Fee Rs. 200.</p>
<form id="supplierForm"><input name="shopName" placeholder="Shop Name - Ex: Bilal Shoes" required><input name="ownerName" placeholder="Owner Name" required><input name="whatsapp" placeholder="WhatsApp" required><input name="productName" placeholder="Product Name - Ex: Nike Air Shoes" required><input name="productPrice" type="number" placeholder="Wholesale Price - 1200" required><input name="stock" type="number" placeholder="Stock - 50" required><input name="image" placeholder="Image Link" required><textarea name="desc" placeholder="Size, Color, Quality"></textarea><select name="category"><option>Shoes</option><option>Kurti</option><option>Watch</option><option>Bag</option><option>Other</option></select><button class="btn btn-gold">Add Product For Approval</button><p id="msg"></p></form></div>
<div class="sec"><div class="card"><div class="pad"><h3>My Products</h3><div id="myProducts"></div></div></div></div>
<script>
function show(){let list=JSON.parse(localStorage.getItem('supplierProducts')||'[]');document.getElementById('myProducts').innerHTML=list.map(p=>`<p>${p.productName} - ${p.productPrice} | Reseller: ${p.resellerPrice} | ${p.status}</p>`).join('')||'No Products';}
document.getElementById('supplierForm').addEventListener('submit',e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target).entries());d.id='SUP-'+Math.floor(1000+Math.random()*9000);d.status='Pending - Admin Approval';d.markazFee=200;d.resellerPrice=parseInt(d.productPrice)+200;let list=JSON.parse(localStorage.getItem('supplierProducts')||'[]');list.push(d);localStorage.setItem('supplierProducts',JSON.stringify(list));document.getElementById('msg').innerText='✅ Added! Admin approve karega.';show();});
show();
</script></body></html>
