<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Panel</title><link rel="stylesheet" href="css.css"></head>
<body><header><div class="top"><div class="logo"></div><h1>SKY <span>ADMIN</span></h1></div><nav><a href="index.html">Home</a><a href="admin.html" class="active">Admin</a><a href="supplier.html">Supplier</a></nav></header>
<div class="sec"><h2>🔐 Admin Login</h2><div class="form-box" id="loginBox"><input id="adminPass" type="password" placeholder="Admin Password"><button class="btn" onclick="login()">Login</button><p style="font-size:12px">Password: <b>sky123</b> (baad me change kar lena)</p></div>
<div id="adminPanel" style="display:none">
<div class="stat"><div>Total Resellers<br><b id="cRes">0</b></div><div>Total Orders<br><b id="cOrd">0</b></div><div>Your Commission (200/order)<br><b id="cComm">Rs. 0</b></div></div><br>
<h3>📦 Supplier Products - Approve / Reject</h3><div id="supList"></div><br>
<h3>👥 Resellers List</h3><div id="resList"></div><br>
<h3>💸 Withdraw Requests</h3><div id="wList"></div><br>
<h3>📦 All Orders</h3><div id="ordList"></div>
</div></div>
<script>
function login(){if(document.getElementById('adminPass').value=='sky123'){document.getElementById('loginBox').style.display='none';document.getElementById('adminPanel').style.display='block';load();}else alert('Wrong Password');}
function load(){
 let res=JSON.parse(localStorage.getItem('resellers')||'[]');let ord=JSON.parse(localStorage.getItem('orders')||'[]');let sup=JSON.parse(localStorage.getItem('supplierProducts')||'[]');let wd=JSON.parse(localStorage.getItem('withdraws')||'[]');
 document.getElementById('cRes').innerText=res.length;document.getElementById('cOrd').innerText=ord.length;document.getElementById('cComm').innerText='Rs. '+(ord.length*200);
 document.getElementById('supList').innerHTML=sup.map((p,i)=>`<div class="card"><div class="pad"><b>${p.productName}</b> - ${p.shopName} - Rs. ${p.productPrice} | Status: ${p.status} <br><button class="btn" style="width:auto" onclick="approve(${i})">✅ Approve</button><button class="btn btn-outline" style="width:auto" onclick="reject(${i})">❌ Reject</button></div></div>`).join('')||'No Supplier Products';
 document.getElementById('resList').innerHTML=res.map(r=>`<p>${r['Full Name']} - ${r['WhatsApp Number']} - ${r['City']}</p>`).join('')||'No Resellers';
 document.getElementById('wList').innerHTML=wd.map(w=>`<p>${w.amount} - ${w.account} - ${w.status}</p>`).join('')||'No Withdraw';
 document.getElementById('ordList').innerHTML=ord.map(o=>`<p>${o.id} - ${o.name} - Rs. ${o.total} - ${o.status}</p>`).join('')||'No Orders';
}
function approve(i){let l=JSON.parse(localStorage.getItem('supplierProducts')||'[]');l[i].status='Approved';localStorage.setItem('supplierProducts',JSON.stringify(l));load();}
function reject(i){let l=JSON.parse(localStorage.getItem('supplierProducts')||'[]');l[i].status='Rejected';localStorage.setItem('supplierProducts',JSON.stringify(l));load();}
</script></body></html>
