<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Withdraw - SKY SHOPPING</title><link rel="stylesheet" href="style9.css"><link rel="stylesheet" href="css.css">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</head>
<body><header><div class="top"><div class="logo"></div><h1>SKY <span>SHOPPING</span></h1></div><nav><a href="index.html">Home</a><a href="products.html">Products</a><a href="Account.html">My Account</a><a href="withdraw.html" class="active">Withdraw</a><a href="admin.html">Admin</a></nav></header>
<div class="form-box"><h2>💸 Withdraw Money</h2><p>Balance: <b id="bal">Rs. 0</b> • Min Withdraw Rs. 500</p>
<p id="balInfo" style="font-size:12px;color:#666"></p>
<input id="wAmt" type="number" placeholder="Amount - Ex: 1000"><input id="wAcc" placeholder="JazzCash / EasyPaisa Number"><select id="wMethod"><option>JazzCash</option><option>EasyPaisa</option><option>Bank Transfer</option></select><button class="btn btn-gold" onclick="doWithdraw()">Request Withdraw</button><div id="wHist" style="margin-top:15px"></div><p style="font-size:12px;color:#666;margin-top:10px">Withdraw 24 hours me process hoga. Fail hone par amount wapis balance me aa jayega. Sirf Delivered Orders ka profit withdraw hoga.</p></div>
<script>
let myName = localStorage.getItem('userName') || localStorage.getItem('sky_reseller_name') || 'Guest';
let myBalance = 0;

async function loadBalance(){
  let totalEarned = 0;
  let totalPaidWithdraw = 0;
  let hist = [];
  try{
    // ✅ FIX: Sirf Firebase se gino - Phone wala localStorage mat milao, warna double ho jayega
    let snap = await db.collection('sky_orders').where('reseller','==',myName).get();
    snap.forEach(d=>{
      let o=d.data();
      // ✅ FIX: Sirf Delivered / Paid wale ka profit - Pending ka nahi
      if(o.status=='Delivered'||o.status=='Paid'){
        // ✅ FIX: profit ya resellerProfit jo bhi ho, 500 khud se mat lagao
        totalEarned += Number(o.profit || o.resellerProfit || 0);
      }
    });
    // Pehle se Paid + Pending withdraw kaat lo
    let wSnap = await db.collection('sky_withdraw').where('name','==',myName).get();
    wSnap.forEach(d=>{ let w=d.data(); hist.push(w); if(w.status=='Paid' || w.status=='Pending') totalPaidWithdraw += Number(w.amount||0); });

    myBalance = Math.max(0, totalEarned - totalPaidWithdraw);
    document.getElementById('bal').innerText='Rs. '+myBalance;
    document.getElementById('balInfo').innerText = `Total Earned: Rs. ${totalEarned} - Withdraw (Paid + Pending): Rs. ${totalPaidWithdraw} = Balance: Rs. ${myBalance}`;
    document.getElementById('wHist').innerHTML='<h3>History</h3>'+hist.map(h=>`<p style="border-bottom:1px solid #eee;padding:6px 0">Rs. ${h.amount} - ${h.number||h.account} - ${h.method||''} - <b style="color:${h.status=='Paid'?'green':h.status=='Rejected'?'red':'orange'}">${h.status}</b></p>`).join('')||'<p>No History Yet</p>';
  }catch(e){ 
    console.log(e);
    // Agar Firebase fail ho to localStorage se ek baar gino - double mat karo
    let orders = JSON.parse(localStorage.getItem('orders')||'[]');
    totalEarned = orders.filter(o=>o.status=='Delivered'||o.status=='Paid').reduce((s,o)=>s+Number(o.profit||0),0);
    myBalance = totalEarned;
    document.getElementById('bal').innerText='Rs. '+myBalance;
    let histLocal=JSON.parse(localStorage.getItem('withdraws')||'[]');
    document.getElementById('wHist').innerHTML='<h3>History</h3>'+histLocal.map(h=>`<p>${h.amount} - ${h.account} - ${h.status}</p>`).join('')||'<p>No History Yet</p>';
  }
}

async function doWithdraw(){
  let amt = Number(document.getElementById('wAmt').value);
  let acc = document.getElementById('wAcc').value.trim();
  let method = document.getElementById('wMethod').value;
  if(!acc) return alert('JazzCash / EasyPaisa Number likho');
  if(!amt || amt<500) return alert('Min 500 - Rs. 500 se kam withdraw nahi hoga');
  if(amt > myBalance) return alert('Balance kam hai! Balance: Rs. '+myBalance+' - Sirf Delivered Orders ka profit withdraw hota hai.');
  let data = { amount: amt, number: acc, account: acc, method: method, name: myName, reseller: myName, status: 'Pending', createdAt: Date.now(), date: new Date().toLocaleString() };
  try{ await db.collection('sky_withdraw').add(data); }catch(e){ alert('Save nahi hua - firebase-config.js check karo'); return; }
  let hist = JSON.parse(localStorage.getItem('withdraws')||'[]'); hist.push(data); localStorage.setItem('withdraws', JSON.stringify(hist));
  alert('✅ Withdraw Request Sent! Admin ko mil gaya hai. 24h me payment');
  location.reload();
}
loadBalance();
</script></body></html>
