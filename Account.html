<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Account</title><link rel="stylesheet" href="style9.css"></head>
  <link rel="stylesheet" href="css.css">
<body><header><div class="top"><div class="logo"></div><h1>SKY <span>SHOPPING</span></h1></div><nav><a href="index.html">Home</a><a href="products.html">Products</a><a href="account.html" class="active">My Account</a><a href="withdraw.html">Withdraw</a><a href="supplier.html">Supplier</a></nav></header>
<div class="sec"><h2 id="userName">Welcome, Sky User 👋</h2><p>Verified Reseller PRO • Level: Gold</p><br><div class="stat"><div>Total Earning<br><b id="earn">Rs. 0</b></div><div>Total Orders<br><b id="ords">0</b></div><div>Balance<br><b id="bal" style="color:green">Rs. 0</b></div></div><br>
<div class="card"><div class="pad"><h3>👥 Refer & Earn - Rs. 200 per Referral</h3><p>https://bilalzia78.github.io/skyshopings/?ref=109</p><button class="btn btn-gold" onclick="navigator.clipboard.writeText('https://bilalzia78.github.io/skyshopings/?ref=109');alert('Link Copied')">Copy Referral Link</button></div></div><br>
<div class="card"><div class="pad"><h3>📦 My Orders</h3><div id="orderList"></div></div></div></div>
<script>
let orders=JSON.parse(localStorage.getItem('orders')||'[]');let tp=orders.reduce((s,o)=>s+parseInt(o.profit||500),0);
document.getElementById('earn').innerText='Rs. '+tp;document.getElementById('ords').innerText=orders.length;document.getElementById('bal').innerText='Rs. '+tp;
document.getElementById('userName').innerText='Welcome, '+(localStorage.getItem('userName')||'Sky User')+' 👋';
document.getElementById('orderList').innerHTML=orders.map(o=>`<p style="border-bottom:1px solid #eee;padding:8px 0">${o.id} - ${o.name} - Rs. ${o.total} - <b>${o.status}</b> <a href="return.html" style="color:red">Return</a></p>`).join('')||'No Orders Yet - <a href="products.html">Shop Now</a>';
</script></body></html>
