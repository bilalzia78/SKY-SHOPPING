<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Products - SKY SHOPPING</title><link rel="stylesheet" href="style9.css"><link rel="stylesheet" href="css.css">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
.search-wrap{display:flex;gap:8px;padding:12px;background:#fff;position:relative;z-index:5;margin-top:10px}
.search-wrap input{flex:1;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:15px}
.search-wrap button{padding:12px 18px;border:none;border-radius:10px;background:#0a1a3d;color:#fff;font-weight:700}
.cat-row{display:flex;gap:8px;overflow-x:auto;padding:10px 12px}
.cat-row button{padding:8px 16px;border:1px solid #ddd;border-radius:20px;background:#fff;white-space:nowrap;cursor:pointer}
.cat-row button.active{background:#0a1a3d;color:#fff;border-color:#0a1a3d}
.prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.prod-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px #0001}
.prod-card img{width:100%;height:170px;object-fit:cover;cursor:zoom-in}
.prod-card .p-pad{padding:10px}
.prod-card h3{margin:0;font-size:15px}
.prod-card p{margin:4px 0;color:#666;font-size:12px}
.prod-price{font-size:16px;font-weight:800;color:#0a1a3d}
.btn-row{display:flex;gap:6px;margin-top:8px}
.btn-row .btn{flex:1}
#imgModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:999;justify-content:center;align-items:center;flex-direction:column;padding:15px}
#imgModal img{max-width:100%;max-height:75vh;border-radius:14px}
#imgModal h3{color:#fff;margin:10px 0 4px}
#imgModal p{color:#ccc;margin:0}
#shareModal{display:none;position:fixed;bottom:0;left:0;width:100%;background:#fff;border-radius:20px 20px 0 0;z-index:1000;padding:18px;box-shadow:0 -5px 20px #0003}
.share-btn{display:flex;align-items:center;gap:10px;width:100%;padding:12px;border:1px solid #eee;border-radius:12px;background:#fff;margin-bottom:8px;font-size:15px;text-align:left;cursor:pointer}
</style>
</head>
<body><header><div class="top"><div class="logo"></div><h1>SKY <span>SHOPPING</span></h1></div><nav><a href="index.html">Home</a><a href="products.html" class="active">Products</a><a href="order.html">Order</a><a href="Account.html">My Account</a><a href="withdraw.html">Withdraw</a><a href="admin.html">Admin</a></nav></header>

<div class="search-wrap">
<input id="searchInput" placeholder="Search... Kurta, Shoes, Watch" oninput="doSearch()">
<button onclick="doSearch()">Search</button>
</div>

<div class="cat-row">
<button class="active" onclick="setCat('All',this)">All</button>
<button onclick="setCat('Shoes',this)">Shoes</button>
<button onclick="setCat('Kurti',this)">Kurta</button>
<button onclick="setCat('Watch',this)">Watch</button>
<button onclick="setCat('Bag',this)">Bag</button>
<button onclick="setCat('Perfume',this)">Perfume</button>
<button onclick="setCat('Other',this)">Other</button>
</div>

<div id="prodGrid" class="prod-grid">Loading...</div>

<div id="imgModal" onclick="this.style.display='none'">
<img id="fullImg" src="">
<h3 id="fullName"></h3>
<p id="fullPrice"></p>
<p style="color:#fff;background:#eab308;color:#000;padding:8px 16px;border-radius:20px;margin-top:12px;font-weight:700">Pic par click karo band karne ke liye • ✕ Close</p>
</div>

<div id="shareModal">
<h3 style="margin:0 0 12px">📤 Share Karo - Sale Barhao</h3>
<button class="share-btn" onclick="shareWhatsApp()">💚 WhatsApp par Share Karo</button>
<button class="share-btn" onclick="shareFacebook()">💙 Facebook par Share Karo</button>
<button class="share-btn" onclick="copyShareLink()">🔗 Link Copy Karo</button>
<button class="share-btn" onclick="shareAny()" style="background:#0a1a3d;color:#fff">📱 TikTok / Instagram / Aur Apps</button>
<button class="share-btn" onclick="closeShare()" style="justify-content:center;color:#999">Band Karo</button>
</div>

<script>
let allProducts = [];
let activeCat = 'All';
let shareProduct = null;

function getDisplayPrice(p){ return p.price || p.supplierPrice || 0; }
function getShop(p){ return p.supplierName || p.supplier || p.shop || 'Sky Official'; }

function setCat(c, btn){
  activeCat = c;
  document.querySelectorAll('.cat-row button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  render();
}
function doSearch(){ render(); }

function render(){
  let q = (document.getElementById('searchInput').value||'').toLowerCase();
  let list = allProducts.filter(p=>{
    let catOk = activeCat=='All' || (p.category||'').toLowerCase().includes(activeCat.toLowerCase()) || (p.name||'').toLowerCase().includes(activeCat.toLowerCase());
    let searchOk = !q || (p.name||'').toLowerCase().includes(q);
    return catOk && searchOk;
  });
  if(list.length==0){ document.getElementById('prodGrid').innerHTML='<p style="grid-column:1/3;text-align:center;padding:20px">Koi product nahi mila.</p>'; return; }
  document.getElementById('prodGrid').innerHTML = list.map(p=>`
    <div class="prod-card">
      <img src="${p.img}" onclick="openFullPic('${p.docId}')" onerror="this.src='https://via.placeholder.com/300x300?text=SKY'">
      <div class="p-pad">
        <h3 onclick="openFullPic('${p.docId}')" style="cursor:pointer">${p.name}</h3>
        <p>By ${getShop(p)} • ${p.code||''}</p>
        <div class="prod-price">Rs. ${getDisplayPrice(p)}</div>
        <p style="font-size:11px;color:#888">Stock: ${p.stock ?? p.quantity ?? 'Available'} • Pic dekhne ke liye pic par click karo</p>
        <div class="btn-row">
          <button class="btn btn-gold" onclick="goOrder('${p.docId}')">Order</button>
          <button class="btn" style="background:#25D366" onclick="openShare('${p.docId}')">📤 Share</button>
        </div>
      </div>
    </div>
  `).join('');
}

function openFullPic(docId){
  let p = allProducts.find(x=>x.docId==docId);
  if(!p) return;
  document.getElementById('fullImg').src = p.img;
  document.getElementById('fullName').innerText = p.name;
  document.getElementById('fullPrice').innerText = 'Rs. ' + getDisplayPrice(p) + ' • Stock: ' + (p.stock ?? p.quantity ?? 'Available');
  document.getElementById('imgModal').style.display='flex';
}

function openShare(docId){
  shareProduct = allProducts.find(x=>x.docId==docId);
  document.getElementById('shareModal').style.display='block';
}
function closeShare(){ document.getElementById('shareModal').style.display='none'; }
function getShareText(){
  let reseller = localStorage.getItem('userName') || 'Sky Reseller';
  return `🔥 ${shareProduct.name} - Sirf Rs. ${getDisplayPrice(shareProduct)} me!\n\nCash on Delivery - Poore Pakistan me Delivery\nOrder karne ke liye message karo\n\nSKY SHOPPING - ${reseller}\nhttps://bilalzia78.github.io/SKY-SHOPPING/products.html`;
}
function shareWhatsApp(){ window.open('https://wa.me/?text='+encodeURIComponent(getShareText()),'_blank'); }
function shareFacebook(){ window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank'); }
function copyShareLink(){ navigator.clipboard.writeText(getShareText()); alert('✅ Copy ho gaya! Ab Facebook / TikTok par paste kar do'); closeShare(); }
async function shareAny(){
  let text = getShareText();
  if(navigator.share){ try{ await navigator.share({title:shareProduct.name, text:text, url:location.href}); }catch(e){} }
  else { copyShareLink(); }
}

function goOrder(docId){
  let p = allProducts.find(x=>x.docId==docId);
  // ✅ FIX: Sahi price bhejo - price ya supplierPrice
  if(p) localStorage.setItem('selectedProduct', JSON.stringify({code:p.code||docId, name:p.name, price:getDisplayPrice(p)}));
  location.href = 'order.html?product='+docId;
}

async function loadProducts(){
  // ✅ FIX: Home se Search aaye to usko Search box me daal do
  let savedQ = localStorage.getItem('searchQ') || '';
  if(savedQ){ document.getElementById('searchInput').value = savedQ; localStorage.removeItem('searchQ'); }
  try{
    let snap = await db.collection('sky_products').where('status','==','Approved').get();
    snap.forEach(d=>{ let data=d.data(); allProducts.push({...data, docId:d.id, code:d.id.slice(0,5).toUpperCase()}); });
  }catch(e){ console.log(e); }
  if(allProducts.length==0){
    allProducts = [{docId:'P001', code:'P001', name:'Women Kurta Set', price:4000, supplierPrice:4000, category:'Kurti', stock:20, img:'https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=500'}];
  }
  render();
}
loadProducts();
</script></body></html>
